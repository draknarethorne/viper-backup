minimum_pre_commit_version: "4.6.1"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ".*\\.(md|bat|cmd|CMD)$"

  - repo: local
    hooks:
      - id: powershell-analysis
        name: PowerShell analysis
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/Invoke-QualityChecks.ps1
        language: system
        files: \.(ps1|psm1|psd1)$
        pass_filenames: false

      - id: full-tests
        name: Full safety test suite
        entry: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/Run-Tests.ps1
        language: system
        pass_filenames: false
        stages: [pre-push]
