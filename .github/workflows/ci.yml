name: Viper Backup CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python quality tooling
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install quality tools
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Run repository quality gates
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate module manifest
        shell: powershell
        run: Test-ModuleManifest .\src\PSViperBackup\PSViperBackup.psd1 -ErrorAction Stop

      - name: Run safety tests
        shell: powershell
        run: .\tests\Run-Tests.ps1

      - name: Verify runtime state is not tracked
        shell: powershell
        run: |
          $tracked = git ls-files local state '*.log' '*.Log' '*.xml'
          if ($tracked) {
              throw "Sensitive/runtime files are tracked: $tracked"
          }
